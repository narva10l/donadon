# ============================================================
#  Donando - que se le pide a SonarQube que analice.
#
#  SonarQube lee este archivo desde la raiz del proyecto. La
#  ruta de cada archivo se toma con "sonar.projectBaseDir"
#  (que por defecto es donde esta este archivo).
#
#  No hay secretos aqui. El token de acceso lo lleva el comando
#  del scanner, no este archivo.
# ============================================================

# El "projectKey" es el identificador unico. Si el dia de manana
# se usa la instancia compartida de otro proyecto, esta clave
# evita que Donando se mezcle con el.
sonar.projectKey=donadon
sonar.projectName=Donando
sonar.projectVersion=1.0.0

# El codigo esta en espanol y en archivos .bat con acentos.
sonar.sourceEncoding=UTF-8

# Analiza todo lo que hay en la raiz, y despues se excluye lo
# que no interesa (abajo). Es mas comodo que ir listando
# carpetas: si manana se agrega un modulo nuevo, ya se analiza.
sonar.sources=.

# Estas carpetas se marcan como "pruebas". No cambia lo que se
# analiza, solo como se presenta: los problemas que salen de
# aqui se agrupan aparte y no ensucian el codigo de la app.
sonar.tests=tests,tests-js

# Lo que NO se analiza. Sin esto, SonarQube se quejaria de los
# .bat, de los compose y de los archivos de configuracion, que no
# son codigo de aplicacion.
sonar.exclusions=\
  .git/**,\
  .github/**,\
  **/.env,\
  **/.env.*,\
  **/*.env,\
  **/__pycache__/**,\
  **/*.py[cod],\
  **/node_modules/**,\
  **/.scannerwork/**,\
  **/seguridad/**,\
  **/*.bat,\
  **/Dockerfile*,\
  **/docker-compose*.yml,\
  **/jest.config.js,\
  **/package.json,\
  **/package-lock.json,\
  **/pytest.ini,\
  **/*.css

# El historial de git se apaga a proposito.
#
# Con esto prendido, SonarQube usa git para saber que lineas son
# nuevas y mostrar un "codigo nuevo" que se supone que no debes
# empeorar. El problema es que el scanner corre como usuario 1000
# dentro del contenedor, mientras que el .git de esta carpeta
# pertenece a tu usuario de Windows, y ahi Git se queja de
# "dubious ownership" y se corta el analisis.
#
# Para medir calidad no hace falta esa funcion, asi que se
# apaga. Si algun dia la quieres, hay que arreglar lo del
# propietario del .git, no solo poner esto en true.
sonar.scm.disabled=true
